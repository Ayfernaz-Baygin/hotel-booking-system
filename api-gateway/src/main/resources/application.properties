spring.application.name=api-gateway
server.port=8088

spring.cloud.gateway.server.webflux.routes[0].id=hotel-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://hotel-service:8080
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/hotels/**,/api/v1/bookings/**,/api/v1/availability/**,/api/v1/reservation-queue/**

spring.cloud.gateway.server.webflux.routes[1].id=comments-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://comments-service:8085
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/comments/**

spring.cloud.gateway.server.webflux.routes[2].id=ai-agent-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://ai-agent-service:8084
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/ai/**

spring.cloud.gateway.server.webflux.routes[3].id=notification-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://notification-service:8086
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/notifications/**

spring.cloud.gateway.server.webflux.routes[4].id=hotel-swagger
spring.cloud.gateway.server.webflux.routes[4].uri=http://hotel-service:8080
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/hotel/swagger-ui/**,/hotel/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[4].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[5].id=comments-swagger
spring.cloud.gateway.server.webflux.routes[5].uri=http://comments-service:8085
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/comments/swagger-ui/**,/comments/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[5].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[6].id=notification-swagger
spring.cloud.gateway.server.webflux.routes[6].uri=http://notification-service:8086
spring.cloud.gateway.server.webflux.routes[6].predicates[0]=Path=/notification/swagger-ui/**,/notification/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[6].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.routes[7].id=ai-swagger
spring.cloud.gateway.server.webflux.routes[7].uri=http://ai-agent-service:8084
spring.cloud.gateway.server.webflux.routes[7].predicates[0]=Path=/ai/swagger-ui/**,/ai/v3/api-docs/**
spring.cloud.gateway.server.webflux.routes[7].filters[0]=StripPrefix=1

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=http://localhost:5173
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=true