spring.application.name=api-gateway
server.port=8080

spring.cloud.gateway.server.webflux.routes[0].id=hotel-service
spring.cloud.gateway.server.webflux.routes[0].uri=http://hotel-service-h2-env-env.eba-3pkfrmiy.eu-north-1.elasticbeanstalk.com
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/hotels/**,/api/v1/bookings/**,/api/v1/availability/**,/api/v1/reservation-queue/**

spring.cloud.gateway.server.webflux.routes[1].id=comments-service
spring.cloud.gateway.server.webflux.routes[1].uri=http://comments-service-env.eba-2n42zb5p.eu-north-1.elasticbeanstalk.com
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/comments/**

spring.cloud.gateway.server.webflux.routes[2].id=notification-service
spring.cloud.gateway.server.webflux.routes[2].uri=http://notification-service1-env.eba-hxupqwcm.eu-north-1.elasticbeanstalk.com
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/notifications/**

spring.cloud.gateway.server.webflux.routes[3].id=ai-agent-service
spring.cloud.gateway.server.webflux.routes[3].uri=http://Ai-agent-service1-env.eba-jv8rtpgc.eu-north-1.elasticbeanstalk.com
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/v1/ai/**

spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOrigins=*
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=*